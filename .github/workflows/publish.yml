name: Publish to pub.dev

# Triggered by pushing a tag like "v0.0.2". Uses pub.dev's built-in GitHub
# Actions integration (OpenID Connect) — no stored token/secret needed —
# but it must be enabled once on the package's pub.dev Admin tab first:
# https://pub.dev/packages/safe_flex/admin, pointing "Automated publishing"
# at this repository and this workflow file (publish.yml). Until that's
# enabled, this workflow will fail with an authentication error.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish
    permissions:
      id-token: write # Required for pub.dev OIDC authentication.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Publish
        run: dart pub publish --force
